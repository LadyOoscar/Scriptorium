name: Build Scriptorium for Windows and Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'electron.vite.config.ts'
      - 'vite.web.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Scriptorium-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          name: scriptorium-pages-${{ github.run_attempt }}
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: scriptorium-pages-${{ github.run_attempt }}
